name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip -qo *.zip
      - name: Build web app and Android project
        working-directory: gameport
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: gameport/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gameport-apk
          path: gameport/android/app/build/outputs/apk/debug/app-debug.apk
